<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book an appointment</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
    .slot { border: 1px solid #ccc; padding: 10px; margin: 6px 0; cursor: pointer; border-radius: 6px; }
    .slot:hover { background: #f0f0f0; }
    .slot.selected { background: #dbeafe; border-color: #3b82f6; }
    #status { margin-top: 12px; font-weight: bold; }
    #loginForm input { display: block; margin: 6px 0; padding: 6px; width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>

  <div id="loginForm">
    <h2>Log in</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Log in</button>
    <p>No account? <a href="#" onclick="register()">Register</a></p>
    <div id="loginStatus"></div>
  </div>

  <div id="bookingSection" style="display:none;">
    <h1>Book an appointment</h1>
    <div id="slots">Loading available slots...</div>
    <button id="bookBtn" disabled>Book selected slot</button>
    <div id="status"></div>
  </div>

  <script>
    const doctorId = 1;
    let selectedSlotId = null;

    async function register() {
      const full_name = prompt('Full name?');
      const email =  prompt('Email?');
      const password =  prompt('Password?');
      if (!full_name || !email || !password) return;

      const res = await fetch('/auth/register/patient', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ full_name, email, password })
      });
      const data = await res.json();
      if (!res.ok) {
        document.getElementById('loginStatus').textContent = data.error;
        return;
      }
      localStorage.setItem('token', data.token);
      showBooking();
    }

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const statusEl = document.getElementById('loginStatus');

      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, role: 'patient' })
      });

      if (!res.ok) {
        statusEl.textContent = 'Invalid email or password';
        return;
      }

      const { token } = await res.json();
      localStorage.setItem('token', token);
      showBooking();
    }

    function showBooking() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('bookingSection').style.display = 'block';
      loadSlots();
    }

    function authHeaders() {
      const token = localStorage.getItem('token');
      return {
        'Content-Type': 'application/json',
        ...(token ? { 'Authorization': `Bearer ${token}` } : {})
      };
    }

    async function loadSlots() {
      const res = await fetch(`/doctors/${doctorId}/availability`);
      const slots = await res.json();
      const container = document.getElementById('slots');

      if (!slots.length) {
        container.textContent = 'No open slots right now.';
        return;
      }

      container.innerHTML = '';
      slots.forEach(slot => {
        const div = document.createElement('div');
        div.className = 'slot';
        div.textContent = new Date(slot.start_time).toLocaleString();
        div.onclick = () => {
          document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
          div.classList.add('selected');
          selectedSlotId = slot.id;
          document.getElementById('bookBtn').disabled = false;
        };
        container.appendChild(div);
      });
    }

    document.getElementById('bookBtn').onclick = async () => {
      const statusEl = document.getElementById('status');
      statusEl.textContent = 'Booking...';

      const res = await fetch('/appointments', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ slot_id: selectedSlotId, reason: 'Checkup' })
      });

      if (res.status === 401) {
        statusEl.textContent = 'Your session expired. Please log in again.';
        localStorage.removeItem('token');
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('bookingSection').style.display = 'none';
        return;
      }
      if (res.status === 409) {
        statusEl.textContent = 'Sorry, that slot was just taken. Please pick another.';
        loadSlots();
        return;
      }
      if (!res.ok) {
        statusEl.textContent = 'Booking failed. Please try again.';
        return;
      }

      const appt = await res.json();
      statusEl.textContent = `Booked! Appointment #${appt.id} confirmed.`;
      document.getElementById('bookBtn').disabled = true;
    };

    if (localStorage.getItem('token')) {
      showBooking();
    }
  </script>
</body>
</html>
